# review-web serving and API proxy. Architecture §28.2.
#
# The ONLY container published to the host (§3). Everything else — review-core, the two workers,
# MongoDB, MinIO, Qdrant — stays on the internal Docker network and is reachable only through here.
server {
    listen 8080;
    listen [::]:8080;


    server_name _;
    # Suppresses the version banner. Not a real control, but it removes a free hint for anyone
    # scanning for a known nginx CVE.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Must exceed review-core's MAX_UPLOAD_SIZE (50MB default), or nginx rejects a large upload with
    # a bare 413 before Spring can return the structured error the UI knows how to display.
    client_max_body_size 100m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location /api/ {
        # Service name, resolved on the Docker network. review-core is never published to the host.
        proxy_pass http://review-core:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 10s;
        # Long READ timeout, short CONNECT timeout, deliberately. A connect failure means review-core
        # is down and should fail fast; a slow response means a large upload is being hashed and
        # stored, which legitimately takes time. One value for both would either kill valid uploads
        # or hide a dead backend for ten minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /index.html {
        # Never cached. The HTML references content-hashed bundles, so a cached index.html would keep
        # pointing at assets that no longer exist after a deploy — a blank page with 404s in the
        # console, and the hardest kind of deploy failure to diagnose.
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # .mjs needs its own block, BEFORE the general asset rule.
    #
    # nginx's bundled mime.types maps `js` but not `mjs`, so an .mjs file is served as
    # application/octet-stream — and a browser REFUSES to execute an ES module with a non-JavaScript
    # MIME type. The failure surfaces as "Failed to fetch dynamically imported module", which reads
    # like a 404 even though nginx returned 200. PDF.js ships its worker as .mjs, so without this the
    # document viewer never starts.
    #
    # `default_type` rather than a `types` block: a types block REPLACES the inherited map instead of
    # extending it, which would break the MIME type of every other extension.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
        # Safe for a year because every filename carries a content hash (§7.2): changed content is a
        # changed URL, so an immutable cache can never serve a stale asset.
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # historyApiFallback for React Router: a deep link like /comparisons/CMP-123 is not a file on
        # disk, and without this it 404s when a reviewer opens a shared link (§19.2).
        try_files $uri $uri/ /index.html;
    }
}
